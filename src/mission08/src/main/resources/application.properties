spring.application.name=mission08
server.port=8080

# =====================================================================
# [1] DB 연결 설정 (H2 임베디드 — 별도 설치 없이 JDBC 로 실제 DB 연결)
#     체크리스트: "application.properties 에 DB 연결 설정이 있는가"
# =====================================================================
spring.datasource.url=jdbc:h2:mem:mission08db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 브라우저로 DB 내용을 직접 확인할 수 있는 H2 콘솔: http://localhost:8080/h2-console
#  (JDBC URL 에 위 spring.datasource.url 을 그대로 입력)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =====================================================================
# [2] JPA / Hibernate 설정
# =====================================================================
# Entity 정의를 바탕으로 기동 시 테이블을 생성/삭제 (데모용). 운영에서는 validate/none 권장.
spring.jpa.hibernate.ddl-auto=create-drop
# H2 방언 명시 (Hibernate 가 H2 에 맞는 SQL 을 생성)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =====================================================================
# [3] Hibernate SQL 로그 출력
#     체크리스트: "Hibernate SQL 로그가 출력되도록 설정했는가"
# =====================================================================
# 실행되는 SQL 을 콘솔에 출력
spring.jpa.show-sql=true
# 출력되는 SQL 을 보기 좋게 정렬
spring.jpa.properties.hibernate.format_sql=true
# SQL 문 + 바인딩 파라미터(?) 값까지 로그로 확인
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
