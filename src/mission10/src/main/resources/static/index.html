<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mission 10 — 멤버 관리 (예외 처리 &amp; FE 연동)</title>
    <style>
        :root { --primary:#ff7a00; --line:#e5e7eb; --bg:#f8fafc; --danger:#dc2626; --ok:#16a34a; }
        * { box-sizing:border-box; }
        body { font-family:'Segoe UI','Apple SD Gothic Neo',sans-serif; margin:0; background:var(--bg); color:#111827; }
        header { background:var(--primary); color:#fff; padding:20px 24px; }
        header h1 { margin:0; font-size:20px; }
        header p { margin:6px 0 0; font-size:13px; opacity:.9; }
        main { max-width:920px; margin:0 auto; padding:24px 16px 60px; }
        .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:20px; }
        .card h2 { margin:0 0 14px; font-size:16px; }
        label { display:block; font-size:13px; margin:10px 0 4px; color:#374151; }
        input, select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
        .row { display:flex; gap:12px; flex-wrap:wrap; }
        .row > div { flex:1; min-width:140px; }
        button { cursor:pointer; border:none; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:600; }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-ghost { background:#fff; border:1px solid var(--line); color:#374151; }
        .btn-danger { background:#fff; border:1px solid var(--danger); color:var(--danger); padding:5px 10px; font-size:12px; }
        .btn-edit { background:#fff; border:1px solid var(--primary); color:var(--primary); padding:5px 10px; font-size:12px; }
        .toolbar { display:flex; gap:8px; align-items:flex-end; }
        .toolbar > div { flex:1; }
        table { width:100%; border-collapse:collapse; margin-top:8px; }
        th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); font-size:14px; }
        th { color:#6b7280; font-weight:600; font-size:12px; text-transform:uppercase; }
        .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; background:#fff3e6; color:var(--primary); font-weight:600; }
        #message { min-height:22px; margin:0 0 12px; font-size:13px; font-weight:600; }
        #message.ok { color:var(--ok); }
        #message.err { color:var(--danger); }
        .muted { color:#9ca3af; font-size:13px; }
        .actions { display:flex; gap:6px; }
        footer { text-align:center; color:#9ca3af; font-size:12px; padding:20px; }
    </style>
</head>
<body>
<header>
    <h1>🦁 Mission 10 — 멤버 관리</h1>
    <p>전역 예외 처리(@RestControllerAdvice) · 통일된 에러 응답 · fetch() 기반 CRUD &amp; 검색 · 작성자: 노경민</p>
</header>

<main>
    <div id="message"></div>

    <!-- 생성 / 수정 폼 -->
    <section class="card">
        <h2 id="formTitle">멤버 등록</h2>
        <input type="hidden" id="memberId"/>
        <div class="row">
            <div>
                <label for="name">이름</label>
                <input id="name" placeholder="예: 노경민"/>
            </div>
            <div>
                <label for="email">이메일</label>
                <input id="email" placeholder="예: km@likelion.org"/>
            </div>
        </div>
        <div class="row">
            <div>
                <label for="generation">기수</label>
                <input id="generation" type="number" min="1" placeholder="예: 13"/>
            </div>
            <div>
                <label for="part">파트</label>
                <select id="part">
                    <option value="BACKEND">BACKEND (백엔드 개발자)</option>
                    <option value="FRONTEND">FRONTEND (프론트엔드 개발자)</option>
                    <option value="DESIGN">DESIGN (디자이너)</option>
                </select>
            </div>
        </div>
        <div class="row" style="margin-top:16px;">
            <button class="btn-primary" id="submitBtn" onclick="submitForm()">등록 (POST)</button>
            <button class="btn-ghost" id="cancelBtn" onclick="resetForm()" style="display:none;">취소</button>
        </div>
    </section>

    <!-- 검색 -->
    <section class="card">
        <h2>검색</h2>
        <div class="toolbar">
            <div>
                <label for="keyword">이름 또는 이메일 키워드</label>
                <input id="keyword" placeholder="예: 백엔 / likelion" onkeydown="if(event.key==='Enter')searchMembers()"/>
            </div>
            <button class="btn-primary" onclick="searchMembers()">검색 (GET)</button>
            <button class="btn-ghost" onclick="loadMembers()">전체</button>
        </div>
    </section>

    <!-- 목록 -->
    <section class="card">
        <h2>멤버 목록 <span class="muted" id="count"></span></h2>
        <table>
            <thead>
            <tr><th>ID</th><th>이름</th><th>이메일</th><th>기수</th><th>파트</th><th>관리</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <p class="muted" id="empty" style="display:none;">표시할 멤버가 없습니다.</p>
    </section>
</main>

<footer>Mission 10 · LIKELION PBL · 작성자: 노경민</footer>

<script>
    const API = '/members';

    // 공통 메시지 표시
    function showMessage(text, isError) {
        const el = document.getElementById('message');
        el.textContent = text;
        el.className = isError ? 'err' : 'ok';
    }

    // 응답 처리 — 실패 시 통일된 ErrorResponse(status/message/errors)를 읽어 사용자에게 표시
    async function handle(res) {
        if (res.status === 204) return null;           // DELETE 성공
        const data = await res.json().catch(() => null);
        if (!res.ok) {
            let msg = (data && data.message) ? data.message : ('요청 실패 (HTTP ' + res.status + ')');
            if (data && data.errors && data.errors.length) msg += ' — ' + data.errors.join(', ');
            throw new Error(msg);
        }
        return data;
    }

    // [R] 전체 조회 — GET /members
    async function loadMembers() {
        try {
            const res = await fetch(API);
            render(await handle(res));
            showMessage('전체 멤버를 불러왔습니다.', false);
        } catch (e) { showMessage(e.message, true); }
    }

    // [R] 검색 — GET /members/search?keyword=
    async function searchMembers() {
        const keyword = document.getElementById('keyword').value.trim();
        try {
            const res = await fetch(API + '/search?keyword=' + encodeURIComponent(keyword));
            const list = await handle(res);
            render(list);
            showMessage('검색 결과 ' + list.length + '건 (keyword: "' + keyword + '")', false);
        } catch (e) { showMessage(e.message, true); }
    }

    // [C/U] 등록(POST) 또는 수정(PUT)
    async function submitForm() {
        const id = document.getElementById('memberId').value;
        const body = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            generation: Number(document.getElementById('generation').value),
            part: document.getElementById('part').value
        };
        const editing = !!id;
        try {
            const res = await fetch(editing ? (API + '/' + id) : API, {
                method: editing ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            await handle(res);
            showMessage(editing ? ('멤버 #' + id + ' 수정 완료 (PUT)') : '멤버 등록 완료 (POST)', false);
            resetForm();
            loadMembers();
        } catch (e) { showMessage(e.message, true); }
    }

    // [U] 수정 폼 채우기
    function editMember(m) {
        document.getElementById('memberId').value = m.id;
        document.getElementById('name').value = m.name;
        document.getElementById('email').value = m.email;
        document.getElementById('generation').value = m.generation;
        document.getElementById('part').value = m.part;
        document.getElementById('formTitle').textContent = '멤버 수정 (#' + m.id + ')';
        document.getElementById('submitBtn').textContent = '수정 (PUT)';
        document.getElementById('cancelBtn').style.display = 'inline-block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // [D] 삭제 — DELETE /members/{id}
    async function deleteMember(id) {
        if (!confirm('멤버 #' + id + ' 를 삭제할까요?')) return;
        try {
            const res = await fetch(API + '/' + id, { method: 'DELETE' });
            await handle(res);
            showMessage('멤버 #' + id + ' 삭제 완료 (DELETE)', false);
            loadMembers();
        } catch (e) { showMessage(e.message, true); }
    }

    function resetForm() {
        document.getElementById('memberId').value = '';
        document.getElementById('name').value = '';
        document.getElementById('email').value = '';
        document.getElementById('generation').value = '';
        document.getElementById('part').value = 'BACKEND';
        document.getElementById('formTitle').textContent = '멤버 등록';
        document.getElementById('submitBtn').textContent = '등록 (POST)';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    // 목록 렌더링
    function render(list) {
        const body = document.getElementById('tableBody');
        const empty = document.getElementById('empty');
        body.innerHTML = '';
        document.getElementById('count').textContent = '(' + list.length + '명)';
        empty.style.display = list.length ? 'none' : 'block';
        for (const m of list) {
            const tr = document.createElement('tr');
            tr.innerHTML =
                '<td>' + m.id + '</td>' +
                '<td>' + esc(m.name) + '</td>' +
                '<td>' + esc(m.email) + '</td>' +
                '<td>' + m.generation + '기</td>' +
                '<td><span class="badge">' + m.part + '</span> ' + esc(m.partDescription || '') + '</td>' +
                '<td class="actions">' +
                    '<button class="btn-edit">수정</button>' +
                    '<button class="btn-danger">삭제</button>' +
                '</td>';
            tr.querySelector('.btn-edit').addEventListener('click', () => editMember(m));
            tr.querySelector('.btn-danger').addEventListener('click', () => deleteMember(m.id));
            body.appendChild(tr);
        }
    }

    // XSS 방지용 이스케이프
    function esc(s) {
        return String(s).replace(/[&<>"']/g, c =>
            ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }

    // 최초 로드
    loadMembers();
</script>
</body>
</html>
