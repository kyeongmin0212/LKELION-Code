spring.application.name=mission10
server.port=8080

# =====================================================================
# [1] DB 연결 설정 (H2 임베디드 — 별도 설치 없이 JDBC 로 실제 DB 연결)
# =====================================================================
spring.datasource.url=jdbc:h2:mem:mission10db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 브라우저로 DB 내용을 직접 확인할 수 있는 H2 콘솔: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =====================================================================
# [2] JPA / Hibernate 설정
# =====================================================================
# Entity 정의를 바탕으로 기동 시 테이블을 생성/삭제 (데모용).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =====================================================================
# [3] Hibernate SQL 로그 출력
# =====================================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
